name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.1.0
        required: true
        default: v2.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $isccPath = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $isccPath) {
            Write-Host "Installed Chocolatey packages:"
            choco list --local-only
            Write-Host "Program Files (x86):"
            Get-ChildItem -LiteralPath ${env:ProgramFiles(x86)} -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          Write-Host "Using Inno Setup compiler: $isccPath"
          "path=$isccPath" >> $env:GITHUB_OUTPUT

      - name: Build Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            .\tools\build_release.ps1 -Version "$env:VERSION" -IsccPath "${{ steps.inno.outputs.path }}"
            Get-ChildItem -LiteralPath release -File | Sort-Object Name | Format-Table Name,Length
          }
          catch {
            Write-Host "::error title=Windows package build failed::$($_.Exception.Message)"
            throw
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qdd-${{ env.VERSION }}-win-x64
          path: |
            release/*.zip
            release/Qdd-*-setup.exe

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qdd-${{ env.VERSION }}-windows-diagnostics
          if-no-files-found: ignore
          path: |
            release/*
            .packaging-build/work/**/warn-*.txt
            .packaging-build/work/**/xref-*.html
            .packaging-build/**/*.log

  github_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Qdd-${{ env.VERSION }}-win-x64
          path: release-assets
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          path=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$path" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release from custom notes
        if: steps.notes.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true

      - name: Create GitHub Release from generated notes
        if: steps.notes.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
